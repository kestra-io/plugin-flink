name: Flink compatibility

on:
  push:
    branches:
      - main
      - releases/*
  pull_request:
    branches:
      - main
      - releases/*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Flink ${{ matrix.flink_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - flink_version: 1.20.1
            compose_file: docker-compose-ci.yml
          - flink_version: 2.0.0
            compose_file: docker-compose-ci-2.0.yml

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Start Flink and wait for readiness
        env:
          COMPOSE_FILE: ${{ matrix.compose_file }}
          FLINK_VERSION: ${{ matrix.flink_version }}
        run: bash .github/setup-unit.sh "$COMPOSE_FILE" "$FLINK_VERSION"

      - name: Run real-cluster compatibility tests
        env:
          COMPOSE_FILE: ${{ matrix.compose_file }}
          FLINK_VERSION: ${{ matrix.flink_version }}
        run: >-
          ./gradlew --no-daemon flinkCompatibilityTest
          "-PflinkCompatibilityVersion=$FLINK_VERSION"
          "-PflinkCompatibilityComposeFile=$COMPOSE_FILE"

      - name: Collect Flink logs on failure
        if: failure()
        env:
          COMPOSE_FILE: ${{ matrix.compose_file }}
        run: docker compose -f "$COMPOSE_FILE" logs --no-color

      - name: Stop Flink cluster
        if: always()
        env:
          COMPOSE_FILE: ${{ matrix.compose_file }}
        run: docker compose -f "$COMPOSE_FILE" down --remove-orphans
